<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're Building Something</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-alt: #161922;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --accent: #6c8cff;
    --border: #262a35;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f8fa;
      --bg-alt: #ffffff;
      --text: #14161a;
      --muted: #5b616e;
      --accent: #4361ee;
      --border: #e4e6eb;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: var(--accent);
    color: white;
  }
  .icon svg { width: 28px; height: 28px; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 12px;
    font-weight: 600;
  }
  p {
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  .bar-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: var(--accent);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  .footnote {
    margin-top: 24px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <h1>We're building something</h1>
    <p>Our website is currently under construction. Please check back soon — we're working hard to bring it to life.</p>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="footnote">Thanks for your patience.</div>
  </div>
</body>
</html>
